<!DOCTYPE html>
<!--
New stuff
 * Timestamps
 * Online user list
 * Cool UI
 * Fixed bugs on log in and log out messages
-->
<html>

<head>

	<meta charset="utf-8">

	<meta name="viewport">

	<title>Multiperson Chat</title>

	<style>
		:root {
			--background-color: #222;
		}

		html,
		body,
		#wrapper {
			overflow: hidden;
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
		}

		body {
			background-color: black;
			font-family: Comic Sans Ms;
		}

		#wrapper {
			display: flex;
			justify-content: center;
			align-items: center;
		}

		#chat {
			width: 600px;
			height: 600px;
			background: linear-gradient(var(--angle), rgb(87, 0, 0), rgb(0, 0, 0));
			display: flex;
			flex-direction: column;
			box-sizing: border-box;
			position: relative;
		}

		#nameScreen {
			background: linear-gradient(var(--angle), rgb(87, 0, 0), rgb(0, 0, 0));
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			box-sizing: border-box;
			padding: 30px;
		}

		#nameScreen h1 {
			color: rgba(255, 255, 255, 0.5);
			margin: 0 0 10px 0;
		}

		#nameScreen p {
			color: white;
			margin: 0 0 20px 0;
		}

		#nameInput {
			width: 300px;
			box-sizing: border-box;
			padding: 12px;
			font-size: 18px;
			border: 5px ridge rgb(255, 255, 255);
			background: rgba(255, 255, 255, 0.4);
			color: white;
		}

		#nameInput:hover {
			background: rgba(255, 255, 255, 0.5);
		}

		#nameInput::placeholder {
			color: rgba(255, 255, 255, 0.6);
		}

		#joinButton {
			width: 300px;
			margin-top: 10px;
			padding: 12px;
			background: rgba(255, 255, 255, 0.4);
			color: white;
			font-size: 16px;
			cursor: pointer;
			border: 5px ridge rgba(255, 255, 255, 0.5);
		}

		#joinButton:hover {
			background: rgba(255, 255, 255, 0.5);
		}

		#chatScreen {
			width: 100%;
			height: 100%;
			display: none;
			flex-direction: column;
		}

		#messages {
			flex: 1;
			overflow-y: auto;
			padding: 12px;
			box-sizing: border-box;
			color: rgba(255, 255, 255, 0.7);
			word-wrap: break-word;
		}

		.message {
			margin-bottom: 8px;
			max-width: 460px;
			overflow-wrap: anywhere;
			word-break: break-word;
		}

		.messageHeader {
			display: flex;
			align-items: baseline;
			gap: 6px;
		}

		.messageText {
			margin-top: 2px;
		}

		.name {
			font-weight: bold;
		}

		.timestamp {
			color: rgba(255, 255, 255, 0.4);
			font-size: 11px;
			margin-right: 5px;
			margin-left: 8px;
		}

		#status {
			height: 26px;
			padding: 4px 10px 20px;
			box-sizing: border-box;
			background: rgba(255, 255, 255, 0.2);
			color: white;
			font-size: 12px;
			border-top: 5px ridge rgba(255, 255, 255, 0.5);
		}

		#inputArea {
			display: flex;
			height: 45px;
		}

		#messageInput {
			flex: 1;
			border: none;
			padding: 10px;
			font-size: 16px;
			background: rgba(255, 255, 255, 0.7);
			border-top: 5px ridge rgba(255, 255, 255, 0.5);
		}

		#sendButton {
			width: 80px;
			border: 5px ridge rgba(255, 255, 255, 0.5);
			background: #333;
			color: white;
			cursor: pointer;
		}

		#sendButton:hover {
			background: #555;
		}

		#userList {
			position: absolute;
			top: 10px;
			right: 10px;
			width: 140px;
			max-height: 200px;
			padding: 8px;
			box-sizing: border-box;
			background: rgba(0, 0, 0, 0.65);
			border: 2px solid rgba(255, 255, 255, 0.4);
			color: white;
			font-size: 13px;
			z-index: 10;
			overflow: hidden;
		}

		#users {
			max-height: 155px;
			overflow-y: auto;
			overflow-x: hidden;
		}

		#userListTitle {
			font-weight: bold;
			margin-bottom: 6px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.3);
			padding-bottom: 4px;
		}

		.user {
			padding: 2px 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
	</style>

</head>

<body>

	<div id="wrapper">

		<div id="chat">

			<div id="nameScreen">

				<h1>Sign up</h1>

				<p>
					Enter the name you want other users to see.
				</p>

				<input id="nameInput" type="text" placeholder="Your name" maxlength="20" autocomplete="off">

				<button id="joinButton">
					Join Chat
				</button>

				<p>
					<br>
					Once a second window pops up do not close it otherwise it won't work
				</p>

			</div>

			<div id="chatScreen">

				<div id="userList">

					<div id="userListTitle">
						Users Online
					</div>

					<div id="users">
					</div>

				</div>

				<div id="messages"></div>

				<div id="status">
					Connecting...
				</div>

				<div id="inputArea">

					<input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off">

					<button id="sendButton">
						Send
					</button>

				</div>

			</div>

		</div>

	</div>

	<script>
    var angle = 0;

    function update() {
        angle += 0.1;
        document.body.style.setProperty("--angle", angle + "deg");
        requestAnimationFrame(update);
    }

    update();

    var nameScreen = document.getElementById("nameScreen");
    var nameInput = document.getElementById("nameInput");
    var joinButton = document.getElementById("joinButton");
    var chatScreen = document.getElementById("chatScreen");
    var myName = "";
    var hasJoined = false;
    var messages = document.getElementById("messages");
    var messageInput = document.getElementById("messageInput");
    var sendButton = document.getElementById("sendButton");
    var statusElement = document.getElementById("status");
    var usersElement = document.getElementById("users");

    var currentRoom = "main";
    var socket = null;
    var relayReady = false;
    var myId = "";
    var lobbyUsers = [];

    var SERVER = "ws://217.154.36.84:7159";

    function updateUserList(users) {
        lobbyUsers = users.slice();

        usersElement.innerHTML = "";

        for (var i = 0; i < users.length; i++) {
            var user = document.createElement("div");

            user.className = "user";
            user.textContent = users[i].name || "Unknown";

            usersElement.appendChild(user);
        }
    }

    function addMessage(name, text, timestamp) {
        var div = document.createElement("div");

        div.className = "message";

        var header = document.createElement("div");
        header.className = "messageHeader";

        var nameSpan = document.createElement("span");
        nameSpan.className = "name";
        nameSpan.textContent = name;

        var timeSpan = document.createElement("span");
        timeSpan.className = "timestamp";

        timeSpan.textContent = timestamp
            ? new Intl.DateTimeFormat(undefined, {
                hour: "numeric",
                minute: "2-digit"
            }).format(new Date(timestamp))
            : "";

        header.appendChild(nameSpan);
        header.appendChild(timeSpan);

        var textSpan = document.createElement("div");
        textSpan.className = "messageText";
        textSpan.textContent = text;

        div.appendChild(header);
        div.appendChild(textSpan);

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function systemMessage(text, timestamp) {
        var div = document.createElement("div");

        div.className = "message";
        div.style.color = "#777";

        var textSpan = document.createElement("span");
        textSpan.textContent = text;

        div.appendChild(textSpan);

        if (timestamp) {
            var timeSpan = document.createElement("span");

            timeSpan.className = "timestamp";
            timeSpan.textContent = new Intl.DateTimeFormat(undefined, {
                hour: "numeric",
                minute: "2-digit"
            }).format(new Date(timestamp));

            div.appendChild(timeSpan);
        }

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function connectToServer() {
        statusElement.textContent = "Connecting...";

        socket = new WebSocket(SERVER);

        socket.onopen = function() {
            console.log("Connected to server");

            socket.send(JSON.stringify({
                type: "join",
                room: currentRoom,
                name: myName
            }));
        };

        socket.onmessage = function(event) {
            var msg;

            try {
                msg = JSON.parse(event.data);
            }
            catch (err) {
                return;
            }

            console.log("Server:", msg);

            if (msg.type === "connected") {
                myId = msg.myId || "";
                relayReady = true;

                statusElement.textContent = "Connected";

                systemMessage("You connected to the lobby.");

                return;
            }

            if (msg.type === "user_list") {
                updateUserList(msg.users || []);

                return;
            }

            if (msg.type === "user_joined") {
                if (msg.name) {
                    systemMessage(
                        msg.name + " joined the lobby.",
                        msg.timestamp
                    );
                }

                return;
            }

            if (msg.type === "user_left") {
                if (msg.name) {
                    systemMessage(
                        msg.name + " left the lobby.",
                        msg.timestamp
                    );
                }

                updateUserList(msg.users || []);

                return;
            }

            if (msg.type === "chat") {
                if (msg.senderId !== myId) {
                    addMessage(
                        msg.name || "Unknown",
                        msg.text || "",
                        msg.timestamp
                    );
                }

                return;
            }

            if (msg.type === "error") {
                statusElement.textContent = "Server error";

                systemMessage(
                    msg.detail || "Unknown server error."
                );

                return;
            }
        };

        socket.onclose = function() {
            relayReady = false;
            myId = "";

            statusElement.textContent = "Disconnected.";

            systemMessage("Disconnected from server.");
        };

        socket.onerror = function() {
            relayReady = false;

            statusElement.textContent = "Connection error.";

            console.log("WebSocket connection error");
        };
    }

    function sendChat() {
        var text = messageInput.value.trim();

        if (text === "") {
            return;
        }

        if (!socket || socket.readyState !== WebSocket.OPEN || !relayReady) {
            systemMessage("Not connected yet.");
            return;
        }

        var message = {
            type: "chat_send",
            room: currentRoom,
            text: text
        };

        addMessage(myName, text, Date.now());

        socket.send(JSON.stringify(message));

        messageInput.value = "";
        messageInput.focus();
    }

    sendButton.onclick = sendChat;

    messageInput.onkeydown = function(event) {
        if (event.key === "Enter") {
            sendChat();
        }
    };

    function joinLobby() {
        currentRoom = "main";
        relayReady = false;

        statusElement.textContent = "Connecting...";

        connectToServer();
    }

    function enterLobby() {
        var name = nameInput.value.trim();

        if (name === "") {
            nameInput.focus();
            return;
        }

        if (hasJoined) {
            return;
        }

        hasJoined = true;
        myName = name;

        nameScreen.style.display = "none";
        chatScreen.style.display = "flex";

        joinLobby();
    }

    joinButton.onclick = enterLobby;

    nameInput.onkeydown = function(event) {
        if (event.key === "Enter") {
            enterLobby();
        }
    };
</script>

</body>

</html>
